# Swarm deployment for labextend.
#
# Two services, one image:
#   - labextend-leader: replicas:1, pinned to node.labels.labextend_leader == true.
#                       Runs HTTP UI :8080 + gRPC :9090; also acts as local agent.
#   - labextend-agent:  mode: global. Agent on every other Linux node. Skipped
#                       on the leader's node (the leader's in-process agent
#                       loop already covers it).
#
# Pre-deploy:
#   docker node update --label-add labextend_leader=true <leader-node-id>
#   export BPM_AGENT_TOKEN=$(openssl rand -hex 32)
#   export BPM_SECRETS_KEY=$(openssl rand -hex 32)
#   export BPM_OIDC_CLIENT_ID=... BPM_OIDC_CLIENT_SECRET=...   (Pocket ID client)
#   docker stack deploy -c docker-stack.yml labextend

version: "3.9"

services:
  labextend-agent:
    image: ghcr.io/bartis-dev/labextend:latest
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.platform.os == linux
          - node.labels.labextend_leader != true
      resources:
        limits:
          memory: 256M
    environment:
      LEADER_ADDR: "labextend-leader:9090"
      BPM_AGENT_TOKEN: "${BPM_AGENT_TOKEN}"
      BPM_AGENT_LABELS: "role=worker"
      BPM_LOG_LEVEL: "info"
      BPM_HEARTBEAT_INTERVAL: "5s"
      BPM_DOCKER_SOCKET: "/host/var/run/docker.sock"
    volumes:
      - /:/host:rslave
      - /var/run/docker.sock:/host/var/run/docker.sock:ro
      - /etc/cron.d:/etc/cron.d
      - labextend-agent-data:/data
    networks:
      - labextend-net

  labextend-leader:
    image: ghcr.io/bartis-dev/labextend:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.labextend_leader == true
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 512M
    environment:
      LEADER: "true"
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      EXTERNAL_URL: "${EXTERNAL_URL:-https://labextend.bartis.dev}"
      BPM_AGENT_TOKEN: "${BPM_AGENT_TOKEN}"
      BPM_SECRETS_KEY: "${BPM_SECRETS_KEY}"
      SESSION_SECURE_COOKIE: "true"
      BPM_LOG_LEVEL: "info"
      BPM_LOG_MAX_LINES: "5000"          # per container ringbuffer cap
      BPM_LOG_RETENTION_HOURS: "0"       # 0 = no time-based prune (cap-only)
      BPM_METRIC_RETENTION_HOURS: "168"  # 7 days of minute buckets
      BPM_DOCKER_SOCKET: "/host/var/run/docker.sock"
      # Pocket ID is the only login; with these empty nobody can sign in. For
      # the secret, either export BPM_OIDC_CLIENT_SECRET or use the Swarm
      # secret below.
      BPM_OIDC_ISSUER: "${BPM_OIDC_ISSUER:-https://id.bartis.dev}"
      BPM_OIDC_CLIENT_ID: "${BPM_OIDC_CLIENT_ID:-}"
      BPM_OIDC_CLIENT_SECRET: "${BPM_OIDC_CLIENT_SECRET:-}"
      # BPM_OIDC_CLIENT_SECRET_FILE: "/run/secrets/labextend_oidc_client_secret"
      BPM_OIDC_NAME: "${BPM_OIDC_NAME:-Pocket ID}"
      BPM_OIDC_USER_GROUP: "${BPM_OIDC_USER_GROUP:-labextend}"
      BPM_OIDC_ADMIN_GROUP: "${BPM_OIDC_ADMIN_GROUP:-labextend-admins}"
      BPM_FILEBROWSER: "${BPM_FILEBROWSER:-false}"
      # Traefik's address(es) as seen from the leader, i.e. its IPs on the
      # overlay network it shares with the leader (a CIDR is fine). Only these
      # peers may set X-Forwarded-For / X-Forwarded-Proto; empty trusts nobody,
      # so the audit log and the login rate limit see Traefik's IP for every
      # client. Never include a range clients can reach directly: they could
      # then forge their IP and reset their own rate limit.
      BPM_TRUSTED_PROXIES: "${BPM_TRUSTED_PROXIES:-}"
    # Uncomment together with the top-level secrets block once the secret exists:
    #   printf %s "<secret>" | docker secret create labextend_oidc_client_secret -
    # secrets:
    #   - labextend_oidc_client_secret
    # No published ports. The UI (:8080) is reached by Traefik over an overlay
    # network both share: attach the leader to Traefik's network (add it below
    # and as an external network at the end) and route to port 8080 via
    # labels. Publishing 8080 on the ingress mesh exposed the panel on every
    # node's public interface, bypassing Traefik's TLS.
    # gRPC :9090 is not published either. Agents reach the leader over
    # labextend-net (LEADER_ADDR: labextend-leader:9090); publish it only for
    # agents outside the swarm, and then behind mTLS.
    volumes:
      - /:/host:rslave
      - /var/run/docker.sock:/host/var/run/docker.sock:ro
      - /etc/cron.d:/etc/cron.d
      - labextend-leader-data:/data
    networks:
      - labextend-net

networks:
  labextend-net:
    driver: overlay
    attachable: true
    # The agent channel (token, decrypted S3 credentials, logs) crosses this
    # network between nodes. Encryption wraps that VXLAN traffic in IPsec ESP:
    # the nodes must allow IP protocol 50 (ESP) between each other, besides
    # the usual 7946/tcp+udp and 4789/udp, or the overlay silently drops it.
    driver_opts:
      encrypted: "true"

# secrets:
#   labextend_oidc_client_secret:
#     external: true

volumes:
  labextend-leader-data:
  labextend-agent-data:
